services:
  - type: web
    name: nekoflix
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nekoflix-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: nekoflix-db
    plan: free
    databaseName: nekoflix
